# Separate from the library CI (ci.yml) so the test-server directory is not
# swept into the coverage-gated library jobs.
name: ESDK TestServer (Node.js)

on:
  pull_request:
    paths:
      - "test-server/**"
      - ".github/workflows/test-server.yml"
  push:
    branches:
      - master
    paths:
      - "test-server/**"
      - ".github/workflows/test-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-language-server:
    name: build + test (live modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build modules
        run: npm run build-node

      - name: Build server
        working-directory: test-server
        run: npx tsc -p tsconfig.json

      - name: Test server
        working-directory: test-server
        run: npm test

  # The cross-language TestServer run, from the shared commons workflow. This
  # checkout supplies the javascript server and library; every other server comes from
  # its configured branch. Only the pairs involving javascript run; the full matrix
  # runs in commons. repo-pat reads the private aws-crypto-tools-rust clones.
  test-server:
    name: TestServer
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: aws/aws-crypto-tools-commons/.github/workflows/esdk-test-server-reusable.yml@main
    with:
      focus: javascript
      checkout-languages: javascript
      runner: ubuntu-latest
    secrets:
      repo-pat: ${{ secrets.COMMONS_REPO_PAT }}
