# This workflow performs static analysis checks.
name: static analysis

on: ["pull_request", "push"]

permissions:
  contents: read

jobs:
  not-grep:
    runs-on: codebuild-CryptoToolsCI-linux-aws-encryption-sdk-javascript-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v2
      - name: not-grep
        uses: mattsb42-meta/not-grep@1.0.1
